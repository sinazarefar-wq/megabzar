<!DOCTYPE html>
<html dir="rtl" lang="fa" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>فروشگاه و کاتالوگ تخصصی ابزارآلات | مگا ابزار</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* متغیرهای تکمیلی اختصاصی کاتالوگ (متغیرهای اصلی تم از layout.js تزریق می‌شوند) */
        :root {
            --success-color: #10b981;
        }
        [data-theme="light"] {
            --success-color: #059669;
        }

        /* ۱. هدر فرعی کاتالوگ (Breadcrumb + نوار دسته‌بندی سریع افقی) */
        .catalog-hero-header {
            background-color: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 18px 0 14px 0;
        }
        .catalog-hero-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
        }
        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .breadcrumb a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .breadcrumb a:hover { color: var(--accent-color); }
        .breadcrumb .current {
            color: var(--text-color);
            font-weight: 700;
        }
        .catalog-page-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .catalog-page-title {
            font-size: 22px;
            font-weight: 900;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .catalog-page-title::before {
            content: '';
            width: 5px;
            height: 22px;
            background-color: var(--accent-color);
            border-radius: 3px;
        }

        /* نوار زیردسته‌های سریع (Quick Category Pills) */
        .quick-cats-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px 6px 2px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .quick-cats-scroll::-webkit-scrollbar { display: none; }
        .quick-cat-pill {
            flex-shrink: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 7px 15px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }
        .quick-cat-pill:hover {
            border-color: var(--accent-color);
        }
        .quick-cat-pill.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
        }

        /* ۲. لایه‌بندی اصلی صفحه کاتالوگ (سایدبار + بخش محصولات) */
        .catalog-container {
            max-width: 1400px;
            margin: 25px auto 50px auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 290px minmax(0, 1fr);
            gap: 24px;
            align-items: start;
        }

        /* ۳. سایدبار فیلترها */
        .filter-drawer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.72);
            z-index: 2200;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .filter-drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .filter-sidebar {
            background-color: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            position: sticky;
            top: 90px;
            max-height: calc(100vh - 110px);
            overflow-y: auto;
            scrollbar-width: thin;
        }
        .filter-sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .filter-sidebar-title {
            font-size: 15.5px;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-clear-filters {
            background: none;
            border: none;
            color: var(--accent-color);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .btn-clear-filters:hover {
            background-color: var(--accent-soft);
        }
        .filter-close-mobile {
            display: none;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
        }

        .filter-section {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 16px;
        }
        .filter-section:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .filter-section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13.5px;
            font-weight: 800;
            margin-bottom: 12px;
            user-select: none;
        }

        /* سوییچ تاگل (فقط کالاهای موجود / تخفیف‌دار) */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .toggle-row:last-child { margin-bottom: 0; }
        .switch-input {
            appearance: none;
            width: 40px;
            height: 22px;
            background-color: var(--border-color);
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: background-color 0.25s;
            flex-shrink: 0;
        }
        .switch-input::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            background-color: #fff;
            border-radius: 50%;
            transition: transform 0.25s;
        }
        .switch-input:checked {
            background-color: var(--accent-color);
        }
        .switch-input:checked::after {
            transform: translateX(18px);
        }

        /* لیست چک‌باکس‌های فیلتر */
        .filter-options-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
            max-height: 195px;
            overflow-y: auto;
            padding-left: 4px;
        }
        .filter-option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }
        .filter-option-item:hover {
            color: var(--text-color);
        }
        .filter-option-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-option-item input[type="checkbox"] {
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
            margin: 0;
        }
        .filter-badge-count {
            font-size: 11px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1px 7px;
            border-radius: 10px;
            color: var(--text-muted);
        }

        /* اسلایدر قیمت */
        .price-slider {
            width: 100%;
            accent-color: var(--accent-color);
            cursor: pointer;
            margin-bottom: 6px;
        }
        .price-slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            color: var(--text-muted);
        }

        .mobile-filter-Sticky-footer {
            display: none;
        }

        /* ۴. ستون سمت چپ: نوار مرتب‌سازی + چیپ‌های فعال + شبکه محصولات */
        .catalog-main-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        .catalog-toolbar {
            background-color: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-mobile-filter-trigger {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            align-items: center;
            gap: 6px;
        }
        .sort-pills-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .sort-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .sort-pill {
            background: none;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .sort-pill:hover {
            color: var(--text-color);
            background-color: var(--card-bg);
        }
        .sort-pill.active {
            background-color: var(--accent-soft);
            border-color: var(--accent-color);
            color: var(--accent-color);
            font-weight: 800;
        }
        .sort-select-mobile {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 700;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .results-counter {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .results-counter strong {
            color: var(--text-color);
            font-weight: 800;
        }
        .view-mode-btns {
            display: flex;
            gap: 6px;
            background-color: var(--bg-color);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .view-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 30px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.2s;
        }
        .view-btn.active {
            background-color: var(--accent-color);
            color: #fff;
        }

        /* نوار تگ‌های فیلتر فعال (Active Filter Chips) */
        .active-filters-bar {
            display: none;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .active-filters-bar.has-items {
            display: flex;
        }
        .filter-chip {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            font-size: 12px;
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .filter-chip button {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 14px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            font-weight: 900;
        }

        /* ۵. شبکه محصولات کاتالوگ (Grid & List Views) */
        .catalog-products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }

        .cat-product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.28s ease, border-color 0.28s ease, box-shadow 0.28s ease;
        }
        .cat-product-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(0,0,0,0.32);
        }

        .card-badges-top {
            position: absolute;
            top: 10px;
            right: 10px;
            left: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            pointer-events: none;
        }
        .badge-off {
            background-color: var(--accent-color);
            color: #fff;
            padding: 3px 9px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 800;
        }
        .badge-stock {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--success-color);
            color: var(--success-color);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 10.5px;
            font-weight: 700;
        }
        .badge-stock.out {
            background-color: rgba(148, 163, 184, 0.15);
            border-color: var(--text-muted);
            color: var(--text-muted);
        }

        .cat-product-img-box {
            background-color: var(--image-bg);
            aspect-ratio: 1 / 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .cat-product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .cat-product-card:hover .cat-product-img {
            transform: scale(1.06);
        }

        .cat-product-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .cat-product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .cat-product-brand {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .cat-product-rating {
            font-size: 11.5px;
            font-weight: 700;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .cat-product-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-color);
            margin: 0 0 10px 0;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 43px;
        }

        .cat-product-specs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .spec-tag {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 6px;
        }

        .cat-product-footer {
            margin-top: auto;
            padding-top: 8px;
        }
        .cat-price-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            margin-bottom: 12px;
            min-height: 42px;
            justify-content: flex-end;
        }
        .cat-old-price {
            color: var(--text-muted);
            text-decoration: line-through;
            font-size: 12px;
        }
        .cat-new-price {
            color: var(--text-color);
            font-size: 16px;
            font-weight: 900;
        }
        .btn-cat-add {
            width: 100%;
            background-color: transparent;
            color: var(--accent-color);
            border: 1.5px solid var(--accent-color);
            padding: 9px 12px;
            border-radius: 9px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-cat-add:hover:not(:disabled) {
            background-color: var(--accent-color);
            color: #fff;
        }
        .btn-cat-add:disabled {
            border-color: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* حالت نمایش لیستی (List View) */
        .catalog-products-grid.list-view {
            grid-template-columns: 1fr;
            gap: 14px;
        }
        .catalog-products-grid.list-view .cat-product-card {
            flex-direction: row;
            align-items: stretch;
        }
        .catalog-products-grid.list-view .cat-product-img-box {
            width: 210px;
            aspect-ratio: auto;
            border-bottom: none;
            border-left: 1px solid var(--border-color);
        }
        .catalog-products-grid.list-view .cat-product-body {
            padding: 18px 20px;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .catalog-products-grid.list-view .cat-product-main-info {
            flex: 1;
        }
        .catalog-products-grid.list-view .cat-product-title {
            font-size: 15px;
            min-height: auto;
            margin-bottom: 8px;
        }
        .catalog-products-grid.list-view .cat-product-footer {
            margin-top: 0;
            min-width: 190px;
            border-right: 1px solid var(--border-color);
            padding-right: 20px;
        }

        /* حالت عدم وجود نتیجه */
        .empty-catalog-state {
            grid-column: 1 / -1;
            background-color: var(--secondary-bg);
            border: 1px dashed var(--border-color);
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
        }
        .empty-catalog-state h3 {
            margin: 0 0 8px 0;
            font-size: 17px;
        }
        .empty-catalog-state p {
            color: var(--text-muted);
            font-size: 13.5px;
            margin: 0 0 18px 0;
        }

        /* ۶. صفحه‌بندی (Pagination) */
        .pagination-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
        }
        .page-btn {
            min-width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--secondary-bg);
            color: var(--text-color);
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .page-btn:hover, .page-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        /* واکنش‌گرایی اختصاصی کاتالوگ در موبایل و تبلت */
        @media (max-width: 992px) {
            .catalog-hero-inner { padding: 0 15px; }
            .catalog-page-title { font-size: 18px; }

            .catalog-container {
                grid-template-columns: 1fr;
                padding: 0 15px;
                margin: 15px auto 35px auto;
                gap: 14px;
            }

            /* تبدیل سایدبار فیلتر به کشوی تمام‌قد موبایل */
            .filter-sidebar {
                position: fixed;
                top: 0;
                right: -100%;
                width: 320px;
                max-width: 88%;
                height: 100vh;
                max-height: 100vh;
                z-index: 2300;
                border-radius: 0;
                border: none;
                border-left: 1px solid var(--border-color);
                transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
                padding-bottom: 80px;
            }
            .filter-sidebar.active {
                right: 0;
            }
            .filter-close-mobile {
                display: block;
            }
            .mobile-filter-Sticky-footer {
                display: flex;
                position: fixed;
                bottom: 0;
                right: -100%;
                width: 320px;
                max-width: 88%;
                background-color: var(--secondary-bg);
                border-top: 1px solid var(--border-color);
                padding: 12px 18px;
                z-index: 2350;
                transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .filter-sidebar.active + .mobile-filter-Sticky-footer {
                right: 0;
            }
            .btn-apply-mobile-filters {
                width: 100%;
                background-color: var(--accent-color);
                color: #fff;
                border: none;
                padding: 11px;
                border-radius: 10px;
                font-family: inherit;
                font-size: 14px;
                font-weight: 800;
                cursor: pointer;
            }

            .catalog-toolbar {
                padding: 10px 12px;
                gap: 8px;
            }
            .btn-mobile-filter-trigger {
                display: inline-flex;
            }
            .sort-pills-group {
                display: none;
            }
            .sort-select-mobile {
                display: block;
            }
            .results-counter {
                font-size: 12px;
            }

            .catalog-products-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }
            .cat-product-body {
                padding: 10px;
            }
            .cat-product-title {
                font-size: 12.5px;
                min-height: 40px;
                margin-bottom: 8px;
            }
            .cat-product-specs {
                display: none;
            }
            .cat-new-price {
                font-size: 14px;
            }
            .btn-cat-add {
                padding: 8px;
                font-size: 12px;
            }

            .catalog-products-grid.list-view .cat-product-img-box {
                width: 115px;
            }
            .catalog-products-grid.list-view .cat-product-body {
                padding: 10px 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .catalog-products-grid.list-view .cat-product-footer {

        document.querySelectorAll('#quickCatsBar .quick-cat-pill').forEach(pill => {
            pill.addEventListener('click', function() {
                document.querySelectorAll('#quickCatsBar .quick-cat-pill').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                const catVal = this.dataset.cat;

                document.querySelectorAll('#catCheckboxList input[type="checkbox"]').forEach(cb => {
                    cb.checked = (catVal !== 'all' && cb.value === catVal);
                });

                document.getElementById('breadcrumbCurrent').innerText = this.innerText.replace(/^[^\w\u0600-\u06FF]+/, '');
                applyCatalogFilters();
            });
        });

        function syncQuickPillsAndFilter() {
            const checkedCats = Array.from(document.querySelectorAll('#catCheckboxList input:checked')).map(c => c.value);
            document.querySelectorAll('#quickCatsBar .quick-cat-pill').forEach(p => {
                if (checkedCats.length === 0) {
                    p.classList.toggle('active', p.dataset.cat === 'all');
                } else if (checkedCats.length === 1) {
                    p.classList.toggle('active', p.dataset.cat === checkedCats[0]);
                } else {
                    p.classList.remove('active');
                }
            });
            applyCatalogFilters();
        }

        // موتور اصلی فیلترینگ، مرتب‌سازی و رندر کارت‌ها
        function applyCatalogFilters() {
            const headerSearchInput = document.getElementById('searchInput');
            const searchQuery = headerSearchInput ? headerSearchInput.value.trim().toLowerCase() : '';
            const onlyInStock = document.getElementById('filterInStock').checked;
            const onlyDiscount = document.getElementById('filterDiscount').checked;
            const maxPrice = parseInt(document.getElementById('priceRangeSlider').value);

            const selectedCats = Array.from(document.querySelectorAll('#catCheckboxList input:checked')).map(i => i.value);
            const selectedBrands = Array.from(document.querySelectorAll('#brandCheckboxList input:checked')).map(i => i.value);
            const selectedPowers = Array.from(document.querySelectorAll('#powerCheckboxList input:checked')).map(i => i.value);

            let filtered = catalogData.filter(item => {
                if (searchQuery && !item.title.toLowerCase().includes(searchQuery) && !item.brand.toLowerCase().includes(searchQuery)) return false;
                if (onlyInStock && !item.inStock) return false;
                if (onlyDiscount && item.discount === 0) return false;
                if (item.price > maxPrice) return false;
                if (selectedCats.length > 0 && !selectedCats.includes(item.category)) return false;
                if (selectedBrands.length > 0 && !selectedBrands.includes(item.brand)) return false;
                if (selectedPowers.length > 0 && !selectedPowers.includes(item.power)) return false;
                return true;
            });

            filtered.sort((a, b) => {
                if (currentSort === 'cheapest') return a.price - b.price;
                if (currentSort === 'expensive') return b.price - a.price;
                if (currentSort === 'discount') return b.discount - a.discount;
                return b.sales - a.sales;
            });

            renderProductsGrid(filtered);
            renderActiveFilterChips(selectedCats, selectedBrands, selectedPowers, onlyInStock, onlyDiscount);
        }

        function renderProductsGrid(items) {
            const grid = document.getElementById('catalogProductsGrid');
            document.getElementById('visibleProductCount').innerText = toPersianNum(items.length);

            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="empty-catalog-state">
                        <h3>ابزاری با این مشخصات یافت نشد!</h3>
                        <p>پیشنهاد می‌کنیم برخی از فیلترهای انتخابی یا محدودیت بودجه را تغییر دهید.</p>
                        <button class="btn-action" style="margin: 0 auto; background: var(--accent-color); color: #fff; border: none;" onclick="resetAllFilters()">نمایش همه محصولات</button>
                    </div>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <article class="cat-product-card" onclick="navigateToProduct(${item.id}, event)">
                    <div class="card-badges-top">
                        ${item.discount > 0 ? `<span class="badge-off">${toPersianNum(item.discount)}٪ تخفیف</span>` : `<span></span>`}
                        <span class="badge-stock ${item.inStock ? '' : 'out'}">${item.inStock ? 'موجود در انبار' : 'ناموجود'}</span>
                    </div>
                    <div class="cat-product-img-box">
                        <img src="${item.image}" alt="${item.title}" class="cat-product-img" loading="lazy">
                    </div>
                    <div class="cat-product-body">
                        <div class="cat-product-main-info">
                            <div class="cat-product-meta">
                                <span class="cat-product-brand">${item.brand}</span>
                                <span class="cat-product-rating">★ ${item.rating}</span>
                            </div>
                            <h3 class="cat-product-title">${item.title}</h3>
                            <div class="cat-product-specs">
                                ${item.specs.map(s => `<span class="spec-tag">${s}</span>`).join('')}
                            </div>
                        </div>
                        <div class="cat-product-footer">
                            <div class="cat-price-wrap">
                                ${item.oldPrice > 0 ? `<span class="cat-old-price">${toPersianNum(item.oldPrice.toLocaleString())}</span>` : ''}
                                <span class="cat-new-price">${toPersianNum(item.price.toLocaleString())} تومان</span>
                            </div>
                            <button class="btn-cat-add" ${!item.inStock ? 'disabled' : ''} onclick="addProductFromCatalog(${item.id}, event)">
                                ${item.inStock ? '🛒 افزودن به سبد خرید' : 'فعلاً ناموجود'}
                            </button>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function renderActiveFilterChips(cats, brands, powers, inStock, discount) {
            const bar = document.getElementById('activeFiltersBar');
            const badge = document.getElementById('mobileActiveFilterBadge');
            let chipsHTML = '';
            let count = 0;

            if (inStock) { count++; chipsHTML += `<span class="filter-chip">فقط موجود <button onclick="document.getElementById('filterInStock').checked=false; applyCatalogFilters();">✕</button></span>`; }
            if (discount) { count++; chipsHTML += `<span class="filter-chip">تخفیف‌دار <button onclick="document.getElementById('filterDiscount').checked=false; applyCatalogFilters();">✕</button></span>`; }
            brands.forEach(b => { count++; chipsHTML += `<span class="filter-chip">برند: ${b} <button onclick="uncheckFilter('#brandCheckboxList', '${b}')">✕</button></span>`; });
            powers.forEach(p => { count++; chipsHTML += `<span class="filter-chip">${p} <button onclick="uncheckFilter('#powerCheckboxList', '${p}')">✕</button></span>`; });

            bar.innerHTML = chipsHTML;
            bar.classList.toggle('has-items', count > 0);
            if (badge) {
                badge.style.display = count > 0 ? 'inline-block' : 'none';
                badge.innerText = toPersianNum(count);
            }
        }

        function uncheckFilter(containerSelector, val) {
            const cb = document.querySelector(`${containerSelector} input[value="${val}"]`);
            if (cb) cb.checked = false;
            applyCatalogFilters();
        }

        function resetAllFilters() {
            const headerSearchInput = document.getElementById('searchInput');
            if (headerSearchInput) headerSearchInput.value = '';
            document.getElementById('filterInStock').checked = false;
            document.getElementById('filterDiscount').checked = false;
            document.getElementById('priceRangeSlider').value = 35000000;
            document.getElementById('priceSliderCurrentVal').innerText = 'تا ۳۵,۰۰۰,۰۰۰ تومان';
            document.querySelectorAll('.filter-options-list input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.querySelectorAll('#quickCatsBar .quick-cat-pill').forEach(p => p.classList.toggle('active', p.dataset.cat === 'all'));
            document.getElementById('breadcrumbCurrent').innerText = 'همه ابزارآلات صنعتی';
            applyCatalogFilters();
        }

        // افزودن محصول از کارت‌های کاتالوگ به سبد خرید سراسری (تعریف‌شده در layout.js)
        function addProductFromCatalog(id, e) {
            e.stopPropagation();
            const prod = catalogData.find(p => p.id === id);
            if (!prod) return;
            const existing = cart.find(item => item.title === prod.title);
            if (existing) existing.quantity += 1;
            else cart.push({ title: prod.title, price: prod.price, image: prod.image, quantity: 1 });
            saveAndUpdateCart();
            toggleCart();
        }

        function navigateToProduct(id, e) {
            if (e.target.closest('.btn-cat-add')) return;
            const transition = document.getElementById('pageTransition');
            if (transition) {
                transition.classList.remove('loaded');
                transition.classList.add('active');
            }
            setTimeout(() => { window.location.href = `product.html?id=${id}`; }, 350);
        }

        // اتصال کادر جستجوی هدر (تزریق‌شده توسط layout.js) به فیلتر زنده کاتالوگ و خواندن پارامترهای URL
        const headerSearchEl = document.getElementById('searchInput');
        if (headerSearchEl) {
            headerSearchEl.addEventListener('input', applyCatalogFilters);
        }

        function initFromUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const catParam = params.get('cat');
            const brandParam = params.get('brand');
            const filterParam = params.get('filter');
            const sortParam = params.get('sort');

            // نگاشت زیردسته‌های خاص به دسته‌های اصلی کاتالوگ
            const catMap = {
                'drills': 'power-tools',
                'grinders': 'power-tools',
                'saws': 'power-tools',
                'cordless': 'power-tools',
                'blowers': 'power-tools',
                'inverter': 'welding',
                'plasma': 'welding',
                'welding-acc': 'welding',
                'sockets': 'hand-tools',
                'pliers': 'hand-tools',
                'toolboxes': 'hand-tools',
                'laser': 'measuring',
                'meters': 'measuring'
            };

            const resolvedCat = catMap[catParam] || catParam;

            if (resolvedCat) {
                const cb = document.querySelector(`#catCheckboxList input[value="${resolvedCat}"]`);
                if (cb) cb.checked = true;
                syncQuickPillsAndFilter();
            }
            if (brandParam) {
                const upperBrand = brandParam.toUpperCase();
                const cb = document.querySelector(`#brandCheckboxList input[value="${upperBrand}"]`);
                if (cb) cb.checked = true;
            }
            if (filterParam === 'special') {
                document.getElementById('filterDiscount').checked = true;
            }
            if (sortParam) {
                setSortMode(sortParam);
            } else {
                applyCatalogFilters();
            }
        }

        initFromUrlParams();
    </script>
</body>
</html>
