<!DOCTYPE html>
<html dir="rtl" lang="fa" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت | مگا ابزار</title>
    <meta name="robots" content="noindex, nofollow">
    <script>
        (function() {
            try { document.documentElement.setAttribute('data-theme', localStorage.getItem('mega_abzar_theme') || 'dark'); } catch (e) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root, [data-theme="dark"] { --bg:#121212; --panel:#1a1a1a; --card:#222; --accent:#e53935; --accent-soft:rgba(229,57,53,.15); --text:#fff; --muted:#a8a8a8; --border:#333; --ok:#2e9e5b; --warn:#f59e0b; }
        [data-theme="light"] { --bg:#f5f5f5; --panel:#fff; --card:#fff; --accent:#d32f2f; --accent-soft:rgba(211,47,47,.1); --text:#212529; --muted:#6c757d; --border:#e0e0e0; }
        [data-theme="navy"] { --bg:#0f172a; --panel:#1e293b; --card:#27354f; --accent:#f59e0b; --accent-soft:rgba(245,158,11,.2); --text:#f8fafc; --muted:#94a3b8; --border:#334155; }
        * { box-sizing: border-box; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        body { margin: 0; font-family: 'Vazirmatn', Tahoma, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
        button, input, select, textarea { font-family: inherit; font-size: 14px; color: var(--text); }
        a { color: var(--accent); }

        .shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
        .side { background: var(--panel); border-left: 1px solid var(--border); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
        .side h1 { font-size: 17px; margin: 0 8px 4px; font-weight: 900; }
        .side .sub { margin: 0 8px 16px; font-size: 12px; color: var(--muted); }
        .side nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: var(--text); text-decoration: none; font-weight: 600; margin-bottom: 2px; cursor: pointer; }
        .side nav a:hover { background: var(--accent-soft); }
        .side nav a.active { background: var(--accent); color: #fff; }
        .side nav .sep { height: 1px; background: var(--border); margin: 10px 4px; }
        .side nav a .badge { margin-right: auto; background: var(--accent); color: #fff; border-radius: 20px; padding: 0 8px; font-size: 11.5px; font-weight: 800; }
        .side nav a.active .badge { background: #fff; color: var(--accent); }

        .main { padding: 26px 30px 60px; min-width: 0; }
        .topbar { display: none; }
        .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
        .page-head h2 { margin: 0; font-size: 22px; font-weight: 900; }
        .page-head .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .btn { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 700; transition: border-color .2s, background .2s; white-space: nowrap; }
        .btn:hover { border-color: var(--accent); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.danger { color: #ff6b66; }
        .btn.sm { padding: 4px 10px; font-size: 12.5px; }
        .btn:disabled { opacity: .4; cursor: not-allowed; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
        .card h3 { margin: 0 0 14px; font-size: 16px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
        .stat b { display: block; font-size: 26px; font-weight: 900; margin-top: 4px; }
        .stat span { color: var(--muted); font-size: 13px; }

        .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
        table { width: 100%; border-collapse: collapse; min-width: 640px; }
        th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { font-size: 12.5px; color: var(--muted); font-weight: 700; background: var(--panel); position: sticky; top: 0; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--accent-soft); }
        td img.thumb { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; background: var(--panel); display: block; }
        td .ttl { max-width: 340px; line-height: 1.7; }
        td.acts { white-space: nowrap; text-align: left; }
        .empty { text-align: center; color: var(--muted); padding: 34px 10px; }
        .tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 20px; padding: 1px 9px; font-size: 12px; font-weight: 700; margin-left: 4px; }
        .tag.ok { background: rgba(46,158,91,.15); color: var(--ok); }
        .tag.off { background: rgba(150,150,150,.18); color: var(--muted); }

        .switch { position: relative; display: inline-block; width: 38px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch span { position: absolute; inset: 0; background: #666; border-radius: 22px; cursor: pointer; transition: .2s; }
        .switch span::before { content: ''; position: absolute; width: 16px; height: 16px; right: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
        .switch input:checked + span { background: var(--ok); }
        .switch input:checked + span::before { transform: translateX(-16px); }
        .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

        .search { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; min-width: 220px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .field.full { grid-column: 1 / -1; }
        .field > label { font-weight: 700; font-size: 13px; }
        .field > label i { color: var(--accent); font-style: normal; }
        .field .help { font-size: 12px; color: var(--muted); line-height: 1.7; }
        .field input[type=text], .field input[type=number], .field select, .field textarea { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; width: 100%; }
        .field textarea { min-height: 80px; resize: vertical; line-height: 1.8; }
        .field textarea.mono { font-family: Consolas, monospace; direction: ltr; text-align: left; min-height: 160px; font-size: 12.5px; }
        .field input.ltr { direction: ltr; text-align: left; }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
        .field .check { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
        .field .checks { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 0; }
        .field .checks label { display: flex; gap: 6px; align-items: center; font-weight: 500; }
        .section-title { grid-column: 1 / -1; margin: 10px 0 0; padding-top: 12px; border-top: 1px dashed var(--border); font-weight: 800; color: var(--accent); }
        .section-title:first-child { border-top: none; margin-top: 0; padding-top: 0; }

        .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-start; justify-content: center; padding: 30px 14px; overflow-y: auto; z-index: 100; }
        .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 760px; padding: 22px; }
        .modal h3 { margin: 0 0 16px; font-size: 18px; }
        .modal .foot { display: flex; gap: 8px; justify-content: flex-start; margin-top: 20px; }
        .error-box { background: rgba(229,57,53,.12); border: 1px solid #e53935; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; line-height: 1.9; }
        .warn-box { background: rgba(245,158,11,.12); border: 1px solid var(--warn); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; line-height: 1.9; }

        #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(30px); background: var(--ok); color: #fff; padding: 10px 22px; border-radius: 12px; font-weight: 700; opacity: 0; pointer-events: none; transition: .25s; z-index: 200; }
        #toast.show { opacity: 1; transform: translateX(-50%); }
        #toast.err { background: #c62828; }

        .order-detail dl { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; margin: 0 0 14px; }
        .order-detail dt { color: var(--muted); }
        .order-detail dd { margin: 0; line-height: 1.8; }
        .status-sel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }

        @media (max-width: 900px) {
            .shell { grid-template-columns: 1fr; }
            .side { position: fixed; right: 0; top: 0; width: 250px; z-index: 90; transform: translateX(100%); transition: transform .25s; box-shadow: -6px 0 24px rgba(0,0,0,.4); }
            .side.open { transform: none; }
            .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
            .main { padding: 18px 14px 50px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="topbar"><button class="btn" id="menuBtn" aria-label="منو">☰</button><b>پنل مدیریت مگا ابزار</b></div>
    <div class="shell">
        <aside class="side" id="side">
            <h1>پنل مدیریت</h1>
            <div class="sub">مگا ابزار</div>
            <nav id="nav" aria-label="بخش‌های پنل"></nav>
        </aside>
        <main class="main" id="view" tabindex="-1"></main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modalRoot"></div>

    <script src="products.js"></script>
    <script src="store.js"></script>
    <script>
    // =====================================================================
    //  پنل مدیریت: همه‌ی صفحه‌ها بر اساس «طرح‌واره» (schema) فیلدها ساخته می‌شوند.
    //  برای مدیریت یک مجموعه جدید فقط یک schema و یک مدخل در PAGES اضافه کنید.
    //  خواندن/نوشتن فقط از Store.get / Store.set انجام می‌شود (بعداً به بک‌اند وصل می‌شود).
    // =====================================================================
    const $ = (s, r = document) => r.querySelector(s);
    const E = escapeHTML;
    const view = $('#view');

    // ---------- ابزارهای عمومی ----------
    function toast(msg, isErr) {
        const t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
        clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 2200);
    }
    const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
    function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => (a[k] = a[k] ?? {}), o); t[last] = v; }
    const fmtDate = iso => { try { return new Date(iso).toLocaleString('fa-IR'); } catch (e) { return iso; } };
    const money = n => toPersianNum(Number(n || 0).toLocaleString('en-US')) + ' ' + getSettings().store.currency;
    const opts = o => (typeof o === 'function' ? o() : o) || [];

    // ---------- فیلدها ----------
    // انواع: text, textarea, number, checkbox, select, tags, lines, linkLines, json, ltr(text)
    function fieldHTML(f, value, idPrefix) {
        const id = idPrefix + f.key.replace(/\W/g, '_');
        const req = f.required ? ' <i>*</i>' : '';
        const label = `<label for="${id}">${E(f.label)}${req}</label>`;
        const help = f.help ? `<div class="help">${E(f.help)}</div>` : '';
        const cls = 'field' + (f.full || ['textarea', 'lines', 'linkLines', 'pairs', 'json', 'tags'].includes(f.type) ? ' full' : '');
        const ro = f.readonly ? ' readonly' : '';
        let input = '';
        switch (f.type) {
            case 'checkbox':
                return `<div class="${cls}"><div class="check"><label class="switch"><input type="checkbox" id="${id}" ${value ? 'checked' : ''}><span></span></label><label for="${id}" style="font-weight:700">${E(f.label)}</label></div>${help}</div>`;
            case 'number':
                input = `<input type="number" id="${id}" value="${E(value ?? '')}" step="${f.step || 1}" ${f.min != null ? `min="${f.min}"` : ''}${ro} class="ltr">`; break;
            case 'select':
                input = `<select id="${id}">${opts(f.options).map(o => `<option value="${E(o.value)}" ${String(o.value) === String(value ?? '') ? 'selected' : ''}>${E(o.label)}</option>`).join('')}</select>`; break;
            case 'textarea':
                input = `<textarea id="${id}">${E(value ?? '')}</textarea>`; break;
            case 'tags':
                input = `<div class="checks" id="${id}">${opts(f.options).map(o => `<label><input type="checkbox" value="${E(o.value)}" ${(value || []).includes(o.value) ? 'checked' : ''}> ${E(o.label)}</label>`).join('')}</div>`; break;
            case 'lines':
                input = `<textarea id="${id}">${E((value || []).join('\n'))}</textarea>`; break;
            case 'linkLines':
                input = `<textarea id="${id}" class="mono">${E((value || []).map(x => [x.label, x.href, x.style].filter((v, i) => i < 2 || (f.extra && v)).join(' | ')).join('\n'))}</textarea>`; break;
            case 'pairs':
                input = `<textarea id="${id}" class="mono">${E((value || []).map(x => `${x.label} | ${x.value}`).join('\n'))}</textarea>`; break;
            case 'json':
                input = `<textarea id="${id}" class="mono">${E(JSON.stringify(value ?? null, null, 2))}</textarea>`; break;
            default:
                input = `<input type="text" id="${id}" value="${E(value ?? '')}"${ro} ${f.ltr ? 'class="ltr"' : ''} ${f.placeholder ? `placeholder="${E(f.placeholder)}"` : ''}>`;
        }
        return `<div class="${cls}">${label}${input}${help}</div>`;
    }

    function readField(f, root, idPrefix) {
        const id = idPrefix + f.key.replace(/\W/g, '_');
        const el = root.querySelector('#' + CSS.escape(id));
        if (!el) return undefined;
        switch (f.type) {
            case 'checkbox': return el.checked;
            case 'number': return el.value === '' ? 0 : Number(el.value);
            case 'tags': return [...el.querySelectorAll('input:checked')].map(i => i.value);
            case 'lines': return el.value.split('\n').map(x => x.trim()).filter(Boolean);
            case 'linkLines':
                return el.value.split('\n').map(x => x.trim()).filter(Boolean).map(line => {
                    const [label, href, style] = line.split('|').map(x => x.trim());
                    const o = { label: label || '', href: href || '' };
                    if (f.extra) o.style = style === 'primary' ? 'primary' : 'secondary';
                    return o;
                });
            case 'pairs':
                return el.value.split('\n').map(x => x.trim()).filter(Boolean).map(line => {
                    const i = line.indexOf('|');
                    return i < 0 ? { label: line, value: '' } : { label: line.slice(0, i).trim(), value: line.slice(i + 1).trim() };
                });
            case 'json': try { return JSON.parse(el.value || 'null'); } catch (e) { throw new Error(`«${f.label}»: JSON نامعتبر است (${e.message})`); }
            default: return el.value.trim();
        }
    }

    function collect(fields, base, root, prefix) {
        const out = JSON.parse(JSON.stringify(base || {}));
        const errors = [];
        fields.forEach(f => {
            if (f.type === 'section') return;
            try {
                const v = readField(f, root, prefix);
                if (v === undefined) return;
                if (f.required && (v === '' || v == null)) errors.push(`«${f.label}» الزامی است.`);
                if (f.type === 'number' && f.min != null && v < f.min) errors.push(`«${f.label}» نباید کمتر از ${f.min} باشد.`);
                setPath(out, f.key, v);
            } catch (e) { errors.push(e.message); }
        });
        return { out, errors };
    }

    // ---------- مودال ----------
    function openModal(html, onReady) {
        const back = document.createElement('div');
        back.className = 'modal-back';
        back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
        $('#modalRoot').appendChild(back);
        const close = () => { back.remove(); document.removeEventListener('keydown', esc); };
        const esc = e => { if (e.key === 'Escape') close(); };
        document.addEventListener('keydown', esc);
        back.addEventListener('mousedown', e => { if (e.target === back) close(); });
        const first = back.querySelector('input:not([readonly]):not([type=checkbox]), textarea, select'); if (first) first.focus();
        onReady && onReady(back, close);
        return close;
    }

    // ---------- ویرایشگر لیست (CRUD عمومی) ----------
    // cfg: {get, set, fields, columns, newItem(list), ordered, searchKeys, noAdd, noDelete, noMove, itemName, lockOnEdit:[keys]}
    function listEditor(host, cfg) {
        let query = '';
        const draw = () => {
            const list = cfg.get();
            let rows = list.map((item, i) => ({ item, i }));
            if (cfg.ordered) rows.sort((a, b) => (a.item.order || 0) - (b.item.order || 0));
            if (query) rows = rows.filter(r => JSON.stringify(cfg.searchKeys ? cfg.searchKeys.map(k => r.item[k]) : r.item).toLowerCase().includes(query.toLowerCase()));
            host.innerHTML = `
                <div class="actions" style="margin-bottom:12px">
                    ${cfg.searchKeys ? `<input class="search" type="search" placeholder="جستجو..." value="${E(query)}" aria-label="جستجو">` : ''}
                    ${cfg.noAdd ? '' : `<button class="btn primary" data-act="add">+ افزودن ${E(cfg.itemName || 'مورد')}</button>`}
                    <span style="color:var(--muted)">${toPersianNum(list.length)} مورد</span>
                </div>
                <div class="table-wrap"><table>
                    <thead><tr>${cfg.columns.map(c => `<th>${E(c.label)}</th>`).join('')}<th></th></tr></thead>
                    <tbody>${rows.length ? rows.map(({ item, i }, pos) => `<tr data-i="${i}">
                        ${cfg.columns.map(c => `<td>${cellHTML(c, item)}</td>`).join('')}
                        <td class="acts">
                            ${cfg.noMove ? '' : `<button class="btn sm" data-act="up" ${pos === 0 ? 'disabled' : ''} aria-label="بالا">↑</button> <button class="btn sm" data-act="down" ${pos === rows.length - 1 ? 'disabled' : ''} aria-label="پایین">↓</button>`}
                            <button class="btn sm" data-act="edit">ویرایش</button>
                            ${cfg.noDelete ? '' : `<button class="btn sm danger" data-act="del">حذف</button>`}
                        </td></tr>`).join('') : `<tr><td class="empty" colspan="${cfg.columns.length + 1}">موردی وجود ندارد.</td></tr>`}</tbody>
                </table></div>`;
        };
        const cellHTML = (c, item) => {
            const v = getPath(item, c.key);
            if (c.type === 'toggle') return `<label class="switch"><input type="checkbox" data-toggle="${E(c.key)}" ${v ? 'checked' : ''} aria-label="${E(c.label)}"><span></span></label>`;
            if (c.type === 'img') return v ? `<img class="thumb" src="${E(imageUrl(v, 100))}" alt="" loading="lazy">` : '';
            if (c.type === 'money') return money(v);
            if (c.type === 'tags') return (v || []).map(t => `<span class="tag">${E(t)}</span>`).join('') || '<span style="color:var(--muted)">—</span>';
            if (c.render) return c.render(item);
            return `<div class="ttl">${E(v ?? '')}</div>`;
        };
        const save = list => { if (!cfg.set(list)) { toast('ذخیره ناموفق بود', true); return false; } return true; };
        const renumber = list => { if (cfg.ordered) list.sort((a, b) => (a.order || 0) - (b.order || 0)).forEach((x, k) => x.order = k + 1); };

        function openForm(index) {
            const list = cfg.get();
            const isNew = index == null;
            const item = isNew ? cfg.newItem(list) : list[index];
            const fields = cfg.fields.map(f => ({ ...f, readonly: f.readonly || (!isNew && (cfg.lockOnEdit || []).includes(f.key)) }));
            openModal(`<h3>${isNew ? 'افزودن' : 'ویرایش'} ${E(cfg.itemName || 'مورد')}</h3>
                <div id="formErr"></div>
                <form id="itemForm"><div class="form-grid">${fields.map(f => f.type === 'section' ? `<div class="section-title">${E(f.label)}</div>` : fieldHTML(f, getPath(item, f.key), 'm_')).join('')}</div>
                <div class="foot"><button class="btn primary" type="submit">ذخیره</button><button class="btn" type="button" data-close>انصراف</button></div></form>`,
            (back, close) => {
                back.querySelector('[data-close]').onclick = close;
                back.querySelector('#itemForm').onsubmit = e => {
                    e.preventDefault();
                    const { out, errors } = collect(fields, item, back, 'm_');
                    const key = cfg.idKey;
                    if (key && isNew || (key && !isNew && out[key] !== item[key])) {
                        if (list.some((x, k) => k !== index && String(x[key]) === String(out[key]))) errors.push(`مقدار «${key}» تکراری است.`);
                    }
                    if (cfg.validate) errors.push(...(cfg.validate(out, list, isNew) || []));
                    if (errors.length) { back.querySelector('#formErr').innerHTML = `<div class="error-box">${errors.map(E).join('<br>')}</div>`; return; }
                    if (isNew) list.push(out); else list[index] = out;
                    renumber(list);
                    if (save(list)) { close(); draw(); toast('ذخیره شد'); cfg.onChange && cfg.onChange(); }
                };
            });
        }

        host.addEventListener('click', e => {
            const b = e.target.closest('[data-act]'); if (!b) return;
            const tr = b.closest('tr'); const i = tr ? +tr.dataset.i : null;
            const list = cfg.get();
            if (b.dataset.act === 'add') return openForm(null);
            if (b.dataset.act === 'edit') return openForm(i);
            if (b.dataset.act === 'del') {
                if (!confirm('این مورد حذف شود؟')) return;
                list.splice(i, 1); renumber(list); if (save(list)) { draw(); toast('حذف شد'); cfg.onChange && cfg.onChange(); }
                return;
            }
            if (b.dataset.act === 'up' || b.dataset.act === 'down') {
                const dir = b.dataset.act === 'up' ? -1 : 1;
                if (cfg.ordered) {
                    const sorted = list.map((x, k) => k).sort((a, c) => (list[a].order || 0) - (list[c].order || 0));
                    const p = sorted.indexOf(i), q = p + dir;
                    if (q < 0 || q >= sorted.length) return;
                    [sorted[p], sorted[q]] = [sorted[q], sorted[p]];
                    sorted.forEach((k, n) => list[k].order = n + 1);
                } else {
                    const j = i + dir; if (j < 0 || j >= list.length) return;
                    [list[i], list[j]] = [list[j], list[i]];
                }
                if (save(list)) draw();
            }
        });
        host.addEventListener('change', e => {
            const t = e.target.closest('[data-toggle]'); if (!t) return;
            const list = cfg.get(); const i = +t.closest('tr').dataset.i;
            setPath(list[i], t.dataset.toggle, t.checked);
            if (save(list)) { toast('ذخیره شد'); cfg.onChange && cfg.onChange(); }
        });
        host.addEventListener('input', e => { if (e.target.matches('.search')) { query = e.target.value; const pos = e.target.selectionStart; draw(); const s = host.querySelector('.search'); s.focus(); s.setSelectionRange(pos, pos); } });
        draw();
    }

                const all = {}; Store.collections().forEach(c => all[c] = Store.get(c));
                const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' }));
                a.download = 'mega-abzar-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); URL.revokeObjectURL(a.href);
            };
            $('#fileImport').onchange = e => {
                const f = e.target.files[0]; if (!f) return;
                const r = new FileReader();
                r.onload = () => {
                    try {
                        const data = JSON.parse(r.result);
                        const known = Store.collections();
                        if (typeof data !== 'object' || Array.isArray(data) || !Object.keys(data).some(k => known.includes(k))) throw new Error('فایل پشتیبان معتبر نیست.');
                        if (!confirm('داده‌های فعلی با این فایل جایگزین شوند؟')) return;
                        const clean = {}; known.forEach(k => { if (k in data) clean[k] = data[k]; });
                        Store.importAll(JSON.stringify(clean)); toast('بازیابی شد'); location.hash = 'dashboard'; updateBadge();
                    } catch (err) { toast(err.message || 'خواندن فایل ناموفق بود', true); }
                };
                r.readAsText(f);
            };
            $('#btnResetAll').onclick = () => { if (confirm('همه‌ی تغییرات و سفارش‌ها پاک شود؟ این کار برگشت‌پذیر نیست.')) { Store.reset(); toast('بازگردانی شد'); location.hash = 'dashboard'; updateBadge(); } };
        } }
    };

    function crud(name, title, hint) {
        view.innerHTML = head(title, hint, `<a class="btn" href="index.html" target="_blank" rel="noopener">مشاهده سایت ↗</a> ${resetBtn(name)}`) + '<div id="host"></div>';
        listEditor($('#host'), SCHEMA[name]);
    }

    // ---------- ناوبری ----------
    const NAV_GROUPS = [['dashboard', 'orders', 'messages'], ['products', 'categories', 'brands'], ['slides', 'banners', 'posts', 'homeSections'], ['contentPages', 'faq'], ['nav', 'footer', 'settings'], ['tools']];
    function renderNav(active) {
        const unseen = Store.get('orders').filter(o => o.status === 'new').length, unreadMsgs = Store.get('messages').filter(m => m.status === 'new').length;
        $('#nav').innerHTML = NAV_GROUPS.map(g => g.map(k => `<a href="#${k}" data-page="${k}" class="${k === active ? 'active' : ''}"><span aria-hidden="true">${PAGES[k].icon}</span> ${PAGES[k].title}${k === 'orders' && unseen ? `<span class="badge">${toPersianNum(unseen)}</span>` : ''}${k === 'messages' && unreadMsgs ? `<span class="badge">${toPersianNum(unreadMsgs)}</span>` : ''}</a>`).join('')).join('<div class="sep"></div>');
    }
    function updateBadge() { renderNav(location.hash.slice(1) in PAGES ? location.hash.slice(1) : 'dashboard'); }
    function show(key) {
        if (!(key in PAGES)) key = 'dashboard';
        view.onclick = view.onchange = null;
        renderNav(key);
        $('#side').classList.remove('open');
        PAGES[key].render();
        document.title = PAGES[key].title + ' | پنل مدیریت مگا ابزار';
    }
    window.addEventListener('hashchange', () => show(location.hash.slice(1)));
    $('#menuBtn').onclick = () => $('#side').classList.toggle('open');
    // بازگردانی یک مجموعه به پیش‌فرض (دکمه‌های data-reset)
    document.addEventListener('click', e => {
        const b = e.target.closest('[data-reset]'); if (!b) return;
        const names = { nav: ['nav', 'megaBottom'], pages: ['pages'] }[b.dataset.reset] || [b.dataset.reset];
        if (!confirm('این بخش به مقدار پیش‌فرض برگردد؟ تغییرات شما در آن پاک می‌شود.')) return;
        names.forEach(n => Store.reset(n)); toast('بازگردانده شد'); show(location.hash.slice(1));
    });
    show(location.hash.slice(1));
    </script>
</body>
</html>
